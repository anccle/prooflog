services:
  postgres:
    image: postgres:16-alpine
    container_name: prooflog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prooflog
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prooflog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: